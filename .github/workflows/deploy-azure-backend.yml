name: Deploy Backend to Azure

on:
  workflow_run:
    workflows:
      - "Backend Tests"
    types: 
      - completed
  workflow_dispatch:

concurrency:
  group: azure-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: carebankacr1778676688.azurecr.io
  IMAGE_NAME: carebank-backend
  CONTAINER_APP_NAME: backend
  RESOURCE_GROUP: carebank-rg

jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name carebankacr1778676688

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run DB migrations (if `DATABASE_URL` secret set)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Skipping DB migrations because DATABASE_URL secret is not set."
            exit 0
          fi

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m alembic upgrade head

      - name: Deploy to Azure Container Apps
        env:
          BACKEND_PUBLIC_URL: https://backend.politefield-3469f7f1.centralindia.azurecontainerapps.io
          CORS_ORIGINS: '["https://carebank-frontend.vercel.app","https://carebank-frontend-git-develop-jefino9488s-projects.vercel.app","https://carebank-frontend-77s9ncsgx-jefino9488s-projects.vercel.app"]'
        run: |
          max_attempts=6
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            if az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --set-env-vars "DB_SCHEMA_MODE=alembic" "BACKEND_PUBLIC_URL=$BACKEND_PUBLIC_URL" "CORS_ORIGINS=$CORS_ORIGINS" "ENVIRONMENT=production"; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              exit 1
            fi

            echo "Container app update is still in progress; retrying in $((attempt * 10)) seconds..."
            sleep $((attempt * 10))
            attempt=$((attempt + 1))
          done
