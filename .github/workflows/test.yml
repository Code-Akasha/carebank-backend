# ============================================================================
# CareBank Backend - CI Test Workflow
# ============================================================================
# Triggers on pull requests to main/develop branches.
# All tests MUST pass before a PR can be merged.
# Configure branch protection rules in GitHub Settings to enforce this.
# ============================================================================

name: Backend Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    needs: [lint]
    if: ${{ needs.lint.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: carebank
          POSTGRES_PASSWORD: password
          POSTGRES_DB: carebank_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://carebank:password@localhost:5432/carebank_test_db
      REDIS_URL: redis://localhost:6379
      OPENAI_API_KEY: test-key-for-ci
      GEMINI_API_KEY: test-key-for-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint check
        run: |
          pip install ruff
          ruff check app/ tests/ --output-format=github
        continue-on-error: false

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short --junitxml=test-results.xml --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy ruff

      - name: Ruff format check
        run: ruff format --check app/ tests/

      - name: Ruff lint
        run: ruff check app/ tests/

  # Gate: All checks must pass
  ci-gate:
    name: CI Gate (All checks passed)
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]] || [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "One or more CI checks failed!"
            echo "  test: ${{ needs.test.result }}"
            echo "  lint: ${{ needs.lint.result }}"
            exit 1
          fi
          echo "All CI checks passed!"
